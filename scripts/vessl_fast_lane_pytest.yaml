name: rfx-931-fast-lane
description: "Default (fast) pytest lane — not gpu/slow/slow_physics — for one NFS checkout of rfx, run on VESSL instead of the shared pod (#931). Set RFX_CHECKOUT and RFX_LABEL in env before creating the run: vessl run create -f scripts/vessl_fast_lane_pytest.yaml"
tags: [rfx, issue-931, pytest, fast-lane]
resources:
  cluster: remilab-c0
  cpu: 16
  memory: 64Gi
image: ghcr.io/bk-squared/rfx-openems:5b423bdfe0c8
env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
  HDF5_USE_FILE_LOCKING: "FALSE"
  LANG: "C.UTF-8"
  JAX_PLATFORMS: "cpu"
  RFX_CHECKOUT: "/root/workspace/byungkwan-workspace/research/rfx-lattice-ownership"
  RFX_LABEL: "branch"
mount:
  /root/workspace/: volume://remilab-fs/personal-workspaces/
run: |-
  set -eu
  PY=python
  command -v "$PY" >/dev/null 2>&1 || PY=/opt/conda/bin/python
  command -v git >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq git; }
  git config --global --add safe.directory "$RFX_CHECKOUT" || true
  cd "$RFX_CHECKOUT"
  echo "=== provenance ==="
  git rev-parse HEAD || true
  git status --short | head -20 || true
  "$PY" -m pip uninstall -y -q jax-cuda12-plugin jax-cuda12-pjrt 2>/dev/null || true
  "$PY" -m pip install -q "jax[cpu]==0.6.2" "numpy<2" "scipy>=1.11" "h5py>=3.8" "matplotlib>=3.7" pytest pytest-xdist
  export PYTHONPATH="$RFX_CHECKOUT"
  export MPLBACKEND=Agg
  "$PY" -c "import jax, rfx; print('probe ok', jax.__version__, jax.devices(), rfx.__version__)"
  OUT=/root/workspace/claude-workspace/rfx/runs/issue931-fastlane-$RFX_LABEL-$(date -u +%Y%m%dT%H%M%SZ)-$(git rev-parse --short HEAD)
  mkdir -p "$OUT"
  echo "$OUT" > /root/workspace/claude-workspace/rfx/runs/issue931-fastlane-$RFX_LABEL.latest
  set +e
  "$PY" -m pytest -q -n 12 -p no:cacheprovider --no-header -rfE --junitxml="$OUT/junit.xml" > "$OUT/pytest.log" 2>&1
  rc=$?
  set -e
  echo "$rc" > "$OUT/pytest.rc"
  echo "fast lane rc=$rc"
  tail -n 60 "$OUT/pytest.log" || true
  grep -E "^(FAILED|ERROR) " "$OUT/pytest.log" > "$OUT/reds.txt" || true
  echo "reds: $(wc -l < "$OUT/reds.txt")"
  exit "$rc"
